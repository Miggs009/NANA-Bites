<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Work Board Reviewer</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Header -->
        <header>

            <h1>📚 Social Work Board Reviewer</h1>

            <p>100 Multiple Choice Flashcards</p>

        </header>

        <!-- Progress -->
        <div class="progress-container">

            <div class="progress-info">

                <span id="questionNumber">
                    Question 1 of 100
                </span>

                <span id="scoreDisplay">
                    Score: 0
                </span>

            </div>

            <div class="progress-bar">

                <div id="progressFill"></div>

            </div>

        </div>

        <!-- Quiz Card -->
        <div class="card">

            <h2 id="question">
                Loading Question...
            </h2>

            <div id="choices" class="choices">

                <!-- Choices generated by JavaScript -->

            </div>

            <div class="buttons">

                <button id="submitBtn">
                    Submit Answer
                </button>

                <button id="nextBtn" disabled>
                    Next Question →
                </button>

            </div>

        </div>

        <!-- Result Section -->
        <div id="resultScreen" class="hidden">

            <h1>🎉 Quiz Finished!</h1>

            <div class="score-card">

                <h2>Your Score</h2>

                <h1 id="finalScore">
                    0 / 100
                </h1>

                <h2 id="percentage">
                    0%
                </h2>

                <h3 id="remarks">
                    Excellent!
                </h3>

            </div>

            <button id="reviewBtn">
                Review Answers
            </button>

            <button onclick="location.reload()">
                Restart Quiz
            </button>

        </div>

        <!-- Review Section -->
        <div id="reviewScreen" class="hidden">

            <h1>📖 Review Answers</h1>

            <div id="reviewContainer">

                <!-- Generated by JavaScript -->

            </div>

            <br>

            <button onclick="location.reload()">
                Take Quiz Again
            </button>

        </div>

    </div>

    <script src="flashcards.js"></script>
    <script src="script.js"></script>

</body>
</html>
